name: platform-gates

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: Native self-hosted platform to test (no Docker)
        type: choice
        required: true
        default: windows
        options: [windows, linux, all, windows-diagnostics, windows-focus]
      evidence_run:
        description: Prior run-attempt to inspect (Windows diagnostics only)
        type: string
        required: false

# Self-hosted runners execute repository code. Do not add pull_request or
# pull_request_target without a separate, disposable runner trust boundary.
permissions:
  contents: read

concurrency:
  group: platform-gates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-diagnostics:
    name: Inspect retained Windows evidence
    if: github.event_name == 'workflow_dispatch' && inputs.platform == 'windows-diagnostics'
    runs-on: [self-hosted, Windows, X64, "windows-ci 02"]
    timeout-minutes: 10
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "0"
      DOTNET_SYSTEM_GLOBALIZATION_PREDEFINEDCULTURESONLY: "true"
      DODO_INSPECT_RUN: ${{ inputs.evidence_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Inspect allowlisted progress without publishing private logs
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned -File "{0}"
        run: node scripts/inspect-private-gate.mjs

  linux-native:
    name: Linux native / Node ${{ matrix.node }}
    # Remote Linux runs are owner-selected; execute directly on the runner.
    if: github.event_name == 'workflow_dispatch' && (inputs.platform == 'linux' || inputs.platform == 'all')
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: [self-hosted, Linux, X64, linux-ci]
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CI: "1"
      DODO_TEST_REQUIRE_LINUX_MEDIA: "1"
      DODO_CI_EVIDENCE: ${{ github.workspace }}/../.dodo-ci-evidence/${{ github.run_id }}-${{ github.run_attempt }}/linux-node-${{ matrix.node }}
    steps:
      - name: Preserve prior Linux evidence outside the checkout
        run: |
          umask 077
          previous="$GITHUB_WORKSPACE/release-evidence/ci"
          saved="$GITHUB_WORKSPACE/../.dodo-ci-evidence"
          if test -d "$previous"; then
            mkdir -p "$saved"
            cp -an "$previous/." "$saved/"
          fi
      - name: Checkout owner-selected revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: true
          persist-credentials: false
      - name: Use Node ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Report prior failed test locations without raw logs
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import { failureLocations, sanitizeGateReport } from './scripts/gate-evidence.mjs';
          const root = process.env.GITHUB_WORKSPACE;
          const base = path.resolve(root, '../.dodo-ci-evidence');
          if (fs.existsSync(base)) {
            const runs = fs.readdirSync(base).filter(name => /^\d+-\d+$/.test(name)).sort((a, b) => b.localeCompare(a, 'en', { numeric: true })).slice(0, 3);
            for (const run of runs) for (const major of [22, 24]) {
              const directory = path.join(base, run, `linux-node-${major}`);
              const file = path.join(directory, 'gate-report.json');
              if (!fs.existsSync(file)) continue;
              try {
                const summary = sanitizeGateReport(JSON.parse(fs.readFileSync(file, 'utf8')));
                if (summary.status !== 'AUTOMATED_FAIL') continue;
                for (const suite of ['core', 'packaging']) {
                  const tests = path.join(directory, `${suite}-tests.json`);
                  if (fs.existsSync(tests)) console.log(JSON.stringify({ previousRun: run, revision: summary.source.revision, node: summary.host.node, suite,
                    ...failureLocations(JSON.parse(fs.readFileSync(tests, 'utf8')), root) }));
                }
              } catch { console.log('[prior-gate] invalid evidence; diagnostics withheld'); }
            }
          }
          JS
      - name: Verify native Linux runner prerequisites
        run: |
          test "$RUNNER_OS" = Linux
          if test "$(id -u)" = 0; then
            echo "::error::Run Linux CI as a non-root user; the browser tests require Chromium sandboxing."
            exit 1
          fi
          for dependency in git python3 make g++ ffmpeg ffprobe espeak-ng; do
            if ! command -v "$dependency" >/dev/null 2>&1; then
              echo "::error::Missing Linux runner prerequisite: $dependency. See docs/CI.md; this workflow does not change system packages."
              exit 1
            fi
          done
          printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install dependencies and Playwright Chromium
        run: |
          npm ci --no-audit --no-fund
          npx --no-install playwright install chromium
      - name: Verify sandboxed Chromium launches on Linux
        run: |
          umask 077
          mkdir -p "$DODO_CI_EVIDENCE"
          if ! node --input-type=module >"$DODO_CI_EVIDENCE/chromium-probe.log" 2>&1 <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true, chromiumSandbox: true, timeout: 15000 });
          try {
            const page = await browser.newPage();
            await page.setContent('<p>Native Linux CI fixture</p>');
            if (!(await page.screenshot()).length) throw new Error('empty screenshot');
          } finally { await browser.close(); }
          JS
          then
            echo "::error::Sandboxed Chromium could not launch. Check Linux libraries and user namespaces per docs/CI.md. Details remain in the runner's private evidence directory."
            exit 1
          fi
      - name: Run native Linux release candidate gate
        run: >-
          npm run release:gate:ci -- --output-dir "$DODO_CI_EVIDENCE"
      - name: Summarize Linux evidence
        id: linux_summary
        if: always()
        run: |
          report="$DODO_CI_EVIDENCE/gate-report.json"
          if test -f "$report"; then
            node scripts/gate-summary.mjs --input-dir "$(dirname "$report")" --github-summary
            echo "DODO_PUBLIC_SUMMARY_BEGIN"
            cat "$(dirname "$report")/public-summary.json"
            echo "DODO_PUBLIC_SUMMARY_END"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload allowlisted Linux summary only
        if: always() && steps.linux_summary.outputs.ready == 'true'
        # The sanitized summary is also retained in the job log. A repository
        # artifact-quota outage must not change the release-gate conclusion.
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-node-${{ matrix.node }}-summary
          path: ${{ env.DODO_CI_EVIDENCE }}/public-summary.json
          include-hidden-files: true # Exact allowlisted file only, not its directory.
          if-no-files-found: error
          retention-days: 7

  windows-native:
    name: ${{ inputs.platform == 'windows-focus' && 'Windows focused diagnostics' || 'Windows native' }} / Node ${{ matrix.node }}
    if: github.event_name == 'push' || inputs.platform == 'windows' || inputs.platform == 'all' || inputs.platform == 'windows-focus'
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(inputs.platform == 'windows-focus' && '[24]' || '[22,24]') }}
    # Select the replacement runner explicitly; runner 01 is retired.
    runs-on: [self-hosted, Windows, X64, "windows-ci 02"]
    timeout-minutes: 90
    defaults:
      run:
        # Only this trusted job process may run locally generated scripts;
        # do not change CurrentUser/LocalMachine policy on the runner host.
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned -File "{0}"
    # Runner 2.337.0 crashes before step 1 under a th-TH host culture unless
    # the runner process starts in invariant mode. Step processes explicitly
    # restore normal globalization so DODO tests still exercise Windows locale
    # behavior. See actions/runner#4686.
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "0"
      DOTNET_SYSTEM_GLOBALIZATION_PREDEFINEDCULTURESONLY: "true"
      DODO_CI_EVIDENCE: ${{ github.workspace }}/../.dodo-ci-evidence/${{ github.run_id }}-${{ github.run_attempt }}/windows-node-${{ matrix.node }}
    steps:
      - name: Prepare Git for Windows before checkout
        run: |
          $git = Get-Command git.exe -CommandType Application -ErrorAction SilentlyContinue
          if (-not $git) {
            # Portable, job-local Git includes Bash for the native shell tests.
            # Pin both the official release and its published SHA-256 digest.
            $archive = Join-Path $env:RUNNER_TEMP "dodo-portable-git.7z.exe"
            $gitRoot = Join-Path $env:RUNNER_TEMP "dodo-portable-git"
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/git-for-windows/git/releases/download/v2.55.0.windows.5/PortableGit-2.55.0.5-64-bit.7z.exe" -OutFile $archive
            $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne "5aa8a20f6e9abb2c755f0e73c91c687701a46b309ad84a0ca6509380fa4ae290") { throw "Portable Git checksum mismatch" }
            $extract = Start-Process -FilePath $archive -ArgumentList @('-y', ('-o"{0}"' -f $gitRoot)) -Wait -PassThru
            if ($extract.ExitCode -ne 0) { throw "Portable Git extraction failed" }
            $gitCmd = Join-Path $gitRoot "cmd"
            if (-not (Test-Path -LiteralPath (Join-Path $gitCmd "git.exe"))) { throw "Portable Git executable missing" }
            Add-Content -LiteralPath $env:GITHUB_PATH -Encoding utf8 -Value $gitCmd
            $env:PATH = "$gitCmd;$env:PATH"
            Remove-Item -LiteralPath $archive
          }
          git --version
          if ($LASTEXITCODE -ne 0) { throw "Git is unavailable for source revision verification" }
          # Configure an existing persistent checkout before actions/checkout
          # refreshes its index. A brand-new checkout is governed by the
          # repository's .gitattributes instead.
          if (Test-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE ".git")) {
            git -C $env:GITHUB_WORKSPACE config --local core.autocrlf false
            if ($LASTEXITCODE -ne 0) { throw "could not configure canonical checkout bytes" }
          }
      - name: Checkout owner-selected revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: true
          persist-credentials: false
      - name: Materialize canonical Git bytes
        run: |
          # A persistent self-hosted working tree may retain CRLF bytes for
          # unchanged files after .gitattributes changes. Re-materialize the
          # trusted HEAD archive so source fingerprints are content-stable.
          git config --local core.autocrlf false
          $archive = Join-Path $env:RUNNER_TEMP "dodo-source-${{ matrix.node }}.tar"
          git archive --format=tar --output=$archive HEAD
          if ($LASTEXITCODE -ne 0) { throw "could not archive the trusted checkout" }
          tar.exe -xf $archive -C $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw "could not materialize the trusted checkout" }
          Remove-Item -LiteralPath $archive -Force
          git update-index --really-refresh
          if ($LASTEXITCODE -ne 0) { throw "could not refresh the canonical checkout index" }
          $expected = git rev-parse HEAD:package-lock.json
          $actual = git hash-object --no-filters package-lock.json
          if ($expected -ne $actual) { throw "checkout bytes do not match the trusted Git object" }
          $dirty = @(git status --porcelain --untracked-files=no)
          if ($dirty.Count -ne 0) { throw "canonical checkout retained tracked changes ($($dirty.Count) path(s))" }
      - name: Use Node ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Verify native Windows runner and enabled Administrator token
        run: |
          $evidence = $env:DODO_CI_EVIDENCE
          New-Item -ItemType Directory -Force $evidence | Out-Null
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          $administrator = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          @{ runner = $env:RUNNER_NAME; platform = [Environment]::OSVersion.Platform.ToString(); arch = $env:PROCESSOR_ARCHITECTURE; administrator = $administrator } |
            ConvertTo-Json -Compress | Set-Content -Encoding utf8 (Join-Path $evidence "runner.json")
          if ($env:RUNNER_OS -ne "Windows") { throw "windows-ci 02 label is not a Windows runner" }
          if (-not $administrator) { throw "windows-ci 02 must run with an enabled Administrator token for native ACL tests" }
      - name: Install dependencies and Playwright Chromium
        shell: cmd
        run: npm ci --ignore-scripts --no-audit --no-fund && npx playwright install chromium
      - name: Run native Windows release candidate gate
        if: inputs.platform != 'windows-focus'
        shell: cmd
        # The Windows service account can publish %TEMP% through an 8.3 alias
        # (for example ADMINI~1). DODO correctly rejects short-name workspace
        # roots, so native fixtures use Actions' canonical long-path temp area.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: >-
          npm run release:gate:ci --
          --output-dir "%DODO_CI_EVIDENCE%"
      - name: Run focused Windows failure diagnostics
        if: inputs.platform == 'windows-focus'
        shell: cmd
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        # npm supplies npm_execpath for shell-free nested npm on Windows.
        run: npm run ci:windows:focus
      - name: Summarize Windows evidence
        id: windows_summary
        if: always()
        run: |
          $reportFile = Join-Path $env:DODO_CI_EVIDENCE "gate-report.json"
          if (Test-Path -LiteralPath $reportFile) {
            node scripts/gate-summary.mjs --input-dir (Split-Path -Parent $reportFile) --github-summary
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Output "DODO_PUBLIC_SUMMARY_BEGIN"
            Get-Content -LiteralPath (Join-Path (Split-Path -Parent $reportFile) "public-summary.json")
            Write-Output "DODO_PUBLIC_SUMMARY_END"
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "ready=true"
          }
      - name: Upload allowlisted Windows summary only
        if: always() && steps.windows_summary.outputs.ready == 'true'
        # The sanitized summary is also retained in the job log. A repository
        # artifact-quota outage must not change the release-gate conclusion.
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-node-${{ matrix.node }}-summary
          path: ${{ env.DODO_CI_EVIDENCE }}/public-summary.json
          include-hidden-files: true # Exact allowlisted file only, not its directory.
          if-no-files-found: error
          retention-days: 7
