name: platform-gates

on:
  push:
    branches: [main]
  workflow_dispatch:

# Self-hosted runners execute repository code. Do not add pull_request or
# pull_request_target without a separate, disposable runner trust boundary.
permissions:
  contents: read

concurrency:
  group: platform-gates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-docker:
    name: Linux Docker / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: [self-hosted, Linux, X64, linux-ci]
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout trusted main revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: true
          persist-credentials: false
      - name: Use Node ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Verify Linux Docker runner
        run: |
          test "$RUNNER_OS" = Linux
          docker version
          if ! docker info; then
            echo "::error::The self-hosted runner account cannot access Docker. Add the runner account to the docker group, then restart the runner so the new group membership takes effect."
            id
            stat -c 'docker socket: %A %U:%G %n' /var/run/docker.sock || true
            exit 1
          fi
      - name: Run isolated Linux release gate
        run: >-
          node scripts/test-linux-docker.mjs
          --node "${{ matrix.node }}"
          --output-dir "$GITHUB_WORKSPACE/release-evidence/ci/linux-node-${{ matrix.node }}"
      - name: Summarize Linux evidence
        if: always()
        run: |
          report="release-evidence/ci/linux-node-${{ matrix.node }}/gate-report.json"
          if test -f "$report"; then
            node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); console.log(`### Linux Docker / Node ${{ matrix.node }}\n\n- Status: ${r.status}\n- Revision: ${r.source.revision}\n- Tests: ${r.steps.filter(s=>s.command.includes("test:all"))[0]?.status === 0 ? "passed" : "failed or not run"}\n- Fresh install: ${r.freshInstall?.status ?? "NOT_RUN"}`)' "$report" >> "$GITHUB_STEP_SUMMARY"
          fi

  windows-native:
    name: Windows native / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    # Select the replacement runner explicitly; runner 01 is retired.
    runs-on: [self-hosted, Windows, X64, "windows-ci 02"]
    timeout-minutes: 90
    defaults:
      run:
        # Only this trusted job process may run locally generated scripts;
        # do not change CurrentUser/LocalMachine policy on the runner host.
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned -File "{0}"
    # Runner 2.337.0 crashes before step 1 under a th-TH host culture unless
    # the runner process starts in invariant mode. Step processes explicitly
    # restore normal globalization so DODO tests still exercise Windows locale
    # behavior. See actions/runner#4686.
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "0"
      DOTNET_SYSTEM_GLOBALIZATION_PREDEFINEDCULTURESONLY: "true"
    steps:
      - name: Prepare Git for Windows before checkout
        run: |
          $git = Get-Command git.exe -CommandType Application -ErrorAction SilentlyContinue
          if (-not $git) {
            # Portable, job-local Git includes Bash for the native shell tests.
            # Pin both the official release and its published SHA-256 digest.
            $archive = Join-Path $env:RUNNER_TEMP "dodo-portable-git.7z.exe"
            $gitRoot = Join-Path $env:RUNNER_TEMP "dodo-portable-git"
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/git-for-windows/git/releases/download/v2.55.0.windows.5/PortableGit-2.55.0.5-64-bit.7z.exe" -OutFile $archive
            $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne "5aa8a20f6e9abb2c755f0e73c91c687701a46b309ad84a0ca6509380fa4ae290") { throw "Portable Git checksum mismatch" }
            $extract = Start-Process -FilePath $archive -ArgumentList @('-y', ('-o"{0}"' -f $gitRoot)) -Wait -PassThru
            if ($extract.ExitCode -ne 0) { throw "Portable Git extraction failed" }
            $gitCmd = Join-Path $gitRoot "cmd"
            if (-not (Test-Path -LiteralPath (Join-Path $gitCmd "git.exe"))) { throw "Portable Git executable missing" }
            Add-Content -LiteralPath $env:GITHUB_PATH -Encoding utf8 -Value $gitCmd
            $env:PATH = "$gitCmd;$env:PATH"
            Remove-Item -LiteralPath $archive
          }
          git --version
          if ($LASTEXITCODE -ne 0) { throw "Git is unavailable for source revision verification" }
      - name: Checkout trusted main revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: true
          persist-credentials: false
      - name: Use Node ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Verify native Windows runner and enabled Administrator token
        run: |
          $evidence = Join-Path $env:GITHUB_WORKSPACE "release-evidence/ci/windows-node-${{ matrix.node }}"
          New-Item -ItemType Directory -Force $evidence | Out-Null
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          $administrator = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          @{ runner = $env:RUNNER_NAME; platform = [Environment]::OSVersion.Platform.ToString(); arch = $env:PROCESSOR_ARCHITECTURE; administrator = $administrator } |
            ConvertTo-Json -Compress | Set-Content -Encoding utf8 (Join-Path $evidence "runner.json")
          if ($env:RUNNER_OS -ne "Windows") { throw "windows-ci 02 label is not a Windows runner" }
          if (-not $administrator) { throw "windows-ci 02 must run with an enabled Administrator token for native ACL tests" }
      - name: Install dependencies and Playwright Chromium
        shell: cmd
        run: npm ci --ignore-scripts --no-audit --no-fund && npx playwright install chromium
      - name: Run native Windows release candidate gate
        shell: cmd
        # The Windows service account can publish %TEMP% through an 8.3 alias
        # (for example ADMINI~1). DODO correctly rejects short-name workspace
        # roots, so native fixtures use Actions' canonical long-path temp area.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: >-
          npm run release:gate:ci --
          --output-dir "%GITHUB_WORKSPACE%\release-evidence\ci\windows-node-${{ matrix.node }}"
      - name: Summarize Windows evidence
        if: always()
        run: |
          $reportFile = Join-Path $env:GITHUB_WORKSPACE "release-evidence/ci/windows-node-${{ matrix.node }}/gate-report.json"
          if (Test-Path -LiteralPath $reportFile) {
            $report = Get-Content -LiteralPath $reportFile -Raw | ConvertFrom-Json
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "### Windows native / Node ${{ matrix.node }}`n`n- Status: $($report.status)`n- Revision: $($report.source.revision)`n- Fresh install: $($report.freshInstall.status)"
          }
